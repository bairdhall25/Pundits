name: Restore W5 grade publish
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/_TRIGGER_W5_RESTORE"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inflate events (optional)
        run: |
          node scripts/_inflate-events.cjs || echo "events inflate failed — continuing with calls only"
      - name: Inflate calls
        run: node scripts/_inflate-calls.cjs
      - name: Inflate tests (optional)
        run: |
          if [ -f scripts/_payload-tests.part0.b64 ]; then
            node scripts/_inflate-tests.cjs || echo "tests inflate failed"
          else
            echo "tests payload missing — publishing grades only"
          fi
      - name: Commit and push restored data
        run: |
          git config user.name "Baird Hall"
          git config user.email "bairdhall25@gmail.com"
          node -e "
            const c=require('./data/calls.json');
            const g=c.filter(x=>x.status==='hit'||x.status==='miss');
            const s=g.filter(x=>String(x.gradedAt||'').startsWith('2026-10-0'));
            console.log('graded since Oct3', s.length, 'hit', s.filter(x=>x.status==='hit').length, 'miss', s.filter(x=>x.status==='miss').length);
            if (s.length < 50) { console.error('too few grades'); process.exit(1); }
          "
          git add data/calls.json
          if node -e "JSON.parse(require('fs').readFileSync('data/events.json','utf8'))" 2>/dev/null; then
            git add data/events.json
          fi
          if [ -f lib/archive.test.ts ] && ! grep -q PLACEHOLDER lib/seo.test.ts 2>/dev/null; then
            git add lib/archive.test.ts lib/page-content.test.ts lib/seo.test.ts lib/social-card/resolver.test.ts scripts/verify-static.mjs || true
          fi
          rm -f scripts/_payload-* scripts/_inflate-*.cjs scripts/_restore-w5-* scripts/_TRIGGER_W5_RESTORE .github/workflows/restore-w5-grade-publish.yml
          git add -u scripts/_payload-* scripts/_inflate-*.cjs scripts/_restore-w5-* scripts/_TRIGGER_W5_RESTORE .github/workflows/restore-w5-grade-publish.yml || true
          git status -sb
          git commit -m "Publish Week 5 Saturday grades (31 hit / 22 miss across 16 CFB finals)." || echo "nothing to commit"
          git push origin HEAD:main

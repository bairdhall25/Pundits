name: Restore W5 grade publish
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/_TRIGGER_W5_RESTORE"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore events.json from pre-corruption SHA
        run: |
          git show 996f0f8b0a82527fe5658655cd8b9141da3a8a24:data/events.json > data/events.json
          node -e "JSON.parse(require('fs').readFileSync('data/events.json','utf8')); console.log('events ok', require('fs').statSync('data/events.json').size)"
      - name: Apply grades from docs/runs tables
        run: node scripts/_apply-grades-from-run.cjs docs/runs/2026-10-03-grade.md data/calls.json data/events.json
      - name: Commit and push
        run: |
          git config user.name "Baird Hall"
          git config user.email "bairdhall25@gmail.com"
          git add data/calls.json data/events.json
          rm -f scripts/_payload-* scripts/_inflate-*.cjs scripts/_apply-grades-from-run.cjs scripts/_restore-w5-* scripts/_TRIGGER_W5_RESTORE .github/workflows/restore-w5-grade-publish.yml
          git add -u scripts/_payload-* scripts/_inflate-*.cjs scripts/_apply-grades-from-run.cjs scripts/_restore-w5-* scripts/_TRIGGER_W5_RESTORE .github/workflows/restore-w5-grade-publish.yml || true
          git status -sb
          git commit -m "Publish Week 5 Saturday grades (31 hit / 22 miss across 16 CFB finals)." || echo "nothing to commit"
          git push origin HEAD:main

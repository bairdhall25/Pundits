# Check-only runtime check of https://pundits.pro/news-sitemap.xml.
# Not a rebuild and not a deploy. Failures appear on this workflow.
# Recovery is operator/Promote `npm run deploy` at the intended 6:30am ET slot.
# Unattended freshness remains pending until this workflow is on main and that
# empty-rebuild ownership is actually active.
name: News sitemap freshness

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-sitemap-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/news-sitemap-freshness.mjs --live

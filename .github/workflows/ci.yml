name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .git/pundits-agent-cache/social-cards
          key: social-cards-${{ runner.os }}-${{ hashFiles('scripts/social-card/**', 'lib/social-card/**', 'scripts/render-og.tsx', 'lib/og.ts') }}
          restore-keys: |
            social-cards-${{ runner.os }}-
      - run: npm run doctor
      - run: npm run check

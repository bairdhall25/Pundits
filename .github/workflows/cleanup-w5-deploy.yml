name: Cleanup W5 deploy temps
on:
  push:
    paths:
      - ".github/workflows/cleanup-w5-deploy.yml"
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "Baird Hall"
          git config user.email "bairdhall25@gmail.com"
          rm -f .github/workflows/deploy-w5-grades.yml scripts/_TRIGGER_W5_DEPLOY .github/workflows/cleanup-w5-deploy.yml
          git add -u
          git status -sb
          git commit -m "chore: remove empty W5 deploy attempt files" || echo nothing
          git push origin HEAD:main
